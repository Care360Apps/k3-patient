name: K3 offline iOS Simulator (synthetic services; not clinical)
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'ios/**'
      - 'tools/k3_offline_build_fixture.py'
      - 'tools/k3_offline_ios_fixture.py'
      - 'tools/k3_razorpay_ios_simulator_patch.py'
      - '.github/workflows/offline-ios-simulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-sandbox:
    runs-on: macos-latest
    timeout-minutes: 80
    env:
      K3_STAGING_API_URL: https://k3-offline.invalid/api/
    steps:
      - uses: actions/checkout@v4
      - name: Verify original source is free of private build files
        run: |
          python3 tools/k3_preflight.py
          python3 tools/k3_notification_preflight.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - name: Use the existing CocoaPods integration for Razorpay on iOS
        run: |
          # razorpay_flutter 1.4.7's SPM path currently fails to expose
          # RazorpayEventCallback during Xcode compilation. The app already
          # has a CocoaPods Podfile and use_frameworks! configuration.
          # Keep this isolated simulator check on that supported integration.
          flutter config --no-enable-swift-package-manager
      - name: Create synthetic-only iOS Firebase plist and compile-time API configuration
        run: |
          # Use the same isolated onboarding preview as Android.
          # This edits only the temporary runner checkout, never release code.
          python3 tools/k3_offline_build_fixture.py
          python3 tools/k3_offline_ios_fixture.py
          python3 tools/k3_staging_config.py --platform ios --firebase ios/Runner/GoogleService-Info.plist --out "$RUNNER_TEMP/k3_offline_ios.json"
      - name: Validate synthetic Firebase plist matches Xcode project layout
        run: |
          test -f ios/GoogleService-Info.plist
          test -f ios/Runner/GoogleService-Info.plist
          cmp ios/GoogleService-Info.plist ios/Runner/GoogleService-Info.plist
          plutil -lint ios/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist
          # No real Firebase credentials should be required for the isolated CI preview.
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          config = plistlib.loads(Path('ios/GoogleService-Info.plist').read_bytes())
          assert config['PROJECT_ID'] == 'k3-synthetic-build-invalid'
          assert config['BUNDLE_ID'] == 'com.cnu.patient'
          print('Verified synthetic-only Firebase settings and Xcode file path')
          PY
      - name: Install packages
        run: flutter pub get
      - name: Apply fail-closed Razorpay analytics compatibility patch in temporary simulator cache
        run: python3 tools/k3_razorpay_ios_simulator_patch.py
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Rewrite generated Retrofit URL to use Dart environment
        run: python3 tools/k3_rewrite_generated_url.py
      - name: Compile iOS Simulator-only binary (not signed for distribution)
        run: flutter build ios --simulator --dart-define=K3_BUILD_ENV=staging --dart-define-from-file="$RUNNER_TEMP/k3_offline_ios.json"
      - name: Package iOS Simulator artifact
        run: |
          test -d build/ios/iphonesimulator/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app "$RUNNER_TEMP/k3-ios-offline-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: k3-offline-ios-simulator-app
          path: ${{ runner.temp }}/k3-ios-offline-simulator.zip
          retention-days: 5
          if-no-files-found: error
