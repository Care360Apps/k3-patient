name: MapLibre compatibility experiment
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/maplibre-compatibility.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
      - run: flutter config --enable-swift-package-manager
      - run: python3 tools/k3_offline_build_fixture.py
      - run: flutter pub get --enforce-lockfile
      - run: python3 tools/k3_agora_ci_patch.py
      - run: python3 tools/k3_iris_ci_patch.py
      - run: python3 tools/k3_v1_embedding_scan.py
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: python3 tools/k3_rewrite_generated_url.py
      - run: flutter build apk --debug --target-platform=android-arm64 --dart-define=K3_BUILD_ENV=staging --dart-define-from-file="$RUNNER_TEMP/k3_offline_dart_defines.json"
