name: MapLibre compatibility experiment
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/maplibre-compatibility.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
      - run: flutter pub add maplibre_gl:0.27.1
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --debug
