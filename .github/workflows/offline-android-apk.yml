name: K3 offline Android APK (synthetic services; not clinical)
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: k3-offline-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim disk from unused GitHub-hosted toolchains
        shell: bash
        run: |
          set -euo pipefail
          echo "Available disk before cleanup:"
          df -h /
          # This is a disposable Ubuntu runner. These preinstalled toolchains
          # are unrelated to Flutter, Gradle, Java or the Android SDK.
          for target in /usr/share/dotnet /opt/ghc /usr/local/share/powershell; do
            if [[ -d "$target" ]]; then
              echo "Removing unused runner toolchain: $target"
              sudo rm -rf -- "$target"
            fi
          done
          echo "Available disk after cleanup:"
          df -h /
          available_kib="$(df -Pk / | awk 'NR==2 {print $4}')"
          if (( available_kib < 8 * 1024 * 1024 )); then
            echo "::error::Less than 8 GiB available after cleanup; aborting expensive Android compilation."
            exit 1
          fi
      - name: Verify source has no sensitive build files
        run: |
          python3 tools/k3_preflight.py
          python3 tools/k3_notification_preflight.py
      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - name: Enable Swift Package Manager (needed to resolve Paystack plugin metadata)
        run: flutter config --enable-swift-package-manager
      - name: Create synthetic offline-only Firebase/API config and unique debug app ID
        run: python3 tools/k3_offline_build_fixture.py
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Ensure Flutter dependencies match the committed lockfile
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Patch Agora 6.2.6 minSdk only in temporary CI pub cache
        run: python3 tools/k3_agora_ci_patch.py
      - name: Patch legacy Google API Headers namespace in temporary pub cache
        run: python3 tools/k3_google_api_headers_ci_patch.py
      - name: Patch Iris native minSdk in temporary CI pub cache
        run: python3 tools/k3_iris_ci_patch.py
      # razorpay_flutter 1.4.7 contains the Android namespace and no removed v1 Registrar.
      - name: Detect obsolete Flutter Android v1 embedding APIs before Gradle
        run: python3 tools/k3_v1_embedding_scan.py
      - name: Generate retrofit code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Preserve environment-defined Retrofit base URL
        run: python3 tools/k3_rewrite_generated_url.py
      - name: Check disk budget before Android compilation
        shell: bash
        run: |
          set -euo pipefail
          echo "Available disk before Gradle/NDK:"
          df -h /
          available_kib="$(df -Pk / | awk 'NR==2 {print $4}')"
          if (( available_kib < 5 * 1024 * 1024 )); then
            echo "::error::Less than 5 GiB free before Android compilation; adjust runner storage rather than repeatedly patch dependencies."
            exit 1
          fi
      - name: Compile debug-only Android APK
        run: >-
          flutter build apk --debug
          --dart-define=K3_BUILD_ENV=staging
          --dart-define-from-file="${{ runner.temp }}/k3_offline_dart_defines.json"
      - name: Package isolated APK
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/k3-offline-sandbox-debug.apk
          cat > dist/README.txt <<'TXT'
          K3 synthetic OFFLINE debug build. It is deliberately disconnected
          from K3 production and staging API/Firebase services. This APK is
          for installation and compilation checks only, NOT clinical testing,
          payments, real user accounts, or App Store/Play Store submission.
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: k3-offline-android-debug-apk
          path: dist/
          retention-days: 5
          if-no-files-found: error
