plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.google.gms.google-services"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Maps Android key belongs to this app's package + signing certificate restrictions.
// Supply privately at build time; never commit the value.
def mapsApiKey = (project.findProperty('K3_ANDROID_MAPS_API_KEY') ?: System.getenv('K3_ANDROID_MAPS_API_KEY') ?: '').toString().trim()

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.cnu.patient"
    // Google Play requires Android 16 (API 36) for updates since Aug 31, 2026.
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        // Required by flutter_local_notifications for Android backports of java.time APIs.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.cnu.patient"
        minSdk 24
        targetSdk 36
        manifestPlaceholders["k3GoogleMapsApiKey"] = mapsApiKey
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { it.name.toLowerCase().contains("release") }
    if (releaseRequested && !keystorePropertiesFile.exists()) {
        throw new GradleException("android/key.properties is missing. Release builds must be signed with the existing Play upload keystore, never the debug key.")
    }
    if (releaseRequested && (!mapsApiKey || mapsApiKey == "Enter_Your_google_map_key")) {
        throw new GradleException("K3_ANDROID_MAPS_API_KEY must be supplied for release and restricted to the Care360 Patient package/signing certificate.")
    }
}

dependencies {
    // Match the Android core library desugaring requirements of
    // flutter_local_notifications (no application feature changes).
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

flutter {
    source '../..'
}
